[project]
name = "anime-data-platform"
version = "0.1.0"
description = "Data engineering pipeline using the MyAnimeList API"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "polars",
    "requests",
]

[dependency-groups]
dev = [
    "prek",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ty.environment]
python-version = "3.12"
